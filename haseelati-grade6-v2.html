<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حصيلتي اللغوية | الصف السادس</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><style>body{margin:0}button,input,select{font:inherit}.rescue{
    --bg:#F5F8FC; --surface:#FFFFFF; --surface-soft:#F0F4FA;
    --sky:#2E9CCA; --sky-dark:#1D6E94; --sky-tint:#E7F4FB;
    --green:#28A87A; --green-tint:#E5F6EF;
    --amber:#E8A93A; --amber-tint:#FBF1DE;
    --purple:#8A63C9; --purple-tint:#F0EAFB;
    --coral:#E2635A; --coral-tint:#FBEAE8;
    --text:#1E2A38; --muted:#64748B; --border:#E3E9F1;
    --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
    --shadow:0 4px 18px rgba(30,42,56,0.06);
    --shadow-hover:0 10px 26px rgba(30,42,56,0.10);
  }
.rescue *{box-sizing:border-box;}
.rescue{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Tajawal',sans-serif; min-height:100vh; padding-bottom:60px;
    -webkit-font-smoothing:antialiased;
  }
.rescue h1, .rescue h2, .rescue h3, .rescue .disp{font-family:'Cairo',sans-serif;}
.rescue .icon{display:inline-flex; align-items:center; justify-content:center;}
.rescue .icon svg{width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.rescue header{
    padding:34px 20px 26px; text-align:center; background:var(--surface);
    border-bottom:1px solid var(--border);
  }
.rescue .brand-badge{
    display:inline-flex; align-items:center; gap:8px; background:var(--sky-tint);
    color:var(--sky-dark); padding:6px 16px; border-radius:30px; font-size:13px; font-weight:700;
  }
.rescue .brand-badge .icon{width:16px; height:16px;}
.rescue header h1{
    font-size:clamp(26px,5.5vw,38px); margin:14px 0 6px; font-weight:800; color:var(--text);
    display:flex; align-items:center; justify-content:center; gap:10px;
  }
.rescue header h1 .icon{width:38px; height:38px; color:var(--sky);}
.rescue header p{color:var(--muted); margin:0; font-size:15px;}
.rescue .wrap{max-width:820px; margin:0 auto; padding:0 18px;}
.rescue .meter-box{
    background:var(--surface); border-radius:var(--radius-lg); padding:22px 24px;
    margin-top:26px; box-shadow:var(--shadow); border:1px solid var(--border);
    transition:box-shadow .3s ease;
  }
.rescue .meter-box.pulse{box-shadow:0 0 0 6px var(--sky-tint), var(--shadow);}
.rescue .meter-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; flex-wrap:wrap; gap:6px;}
.rescue .meter-top .rank{font-weight:700; color:var(--sky-dark); font-size:16px; font-family:'Cairo';}
.rescue .meter-top .count{color:var(--muted); font-size:13px;}
.rescue .meter-track{
    height:16px; background:var(--surface-soft); border-radius:20px; overflow:hidden;
  }
.rescue .meter-fill{
    height:100%; width:0%; background:linear-gradient(90deg,var(--sky),var(--green));
    border-radius:20px; transition:width .6s cubic-bezier(.34,1.56,.64,1);
  }
.rescue .badge-row{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
.rescue .badge-row span{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:20px;
    background:var(--surface-soft); color:var(--muted); border:1px solid var(--border);
    transition:all .25s ease;
  }
.rescue .badge-row span .icon{width:14px; height:14px;}
.rescue .badge-row span.on{background:var(--amber-tint); color:#9A6B0E; border-color:#F3D48A;}
.rescue .missions{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:16px; margin-top:26px;
  }
.rescue .mission-card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:20px; cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease;
    text-align:right; box-shadow:var(--shadow);
  }
.rescue .mission-card:hover{transform:translateY(-4px); box-shadow:var(--shadow-hover);}
.rescue .mission-card:focus-visible{outline:3px solid var(--sky); outline-offset:2px;}
.rescue .mission-card .icon{
    width:46px; height:46px; border-radius:14px; padding:11px;
  }
.rescue .mission-card h3{margin:14px 0 4px; font-size:17px; color:var(--text); font-weight:700;}
.rescue .mission-card p{margin:0; font-size:13.5px; color:var(--muted); line-height:1.6;}
.rescue .mission-card .prog{margin-top:12px; font-size:12.5px; font-weight:700;}
.rescue .mission-card .cta{
    margin-top:14px; display:flex; align-items:center; gap:6px; font-size:13.5px;
    font-weight:700; color:var(--sky-dark);
  }
.rescue .mission-card .cta .icon{width:16px; height:16px;}
.rescue #quizArea{display:none; margin-top:26px;}
.rescue .quiz-panel{
    background:var(--surface); border-radius:var(--radius-lg); padding:26px;
    border:1px solid var(--border); box-shadow:var(--shadow);
  }
.rescue .quiz-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
.rescue .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface-soft); border:1px solid var(--border); color:var(--text);
    padding:9px 16px; border-radius:30px; cursor:pointer; font-family:'Tajawal'; font-weight:700; font-size:13.5px;
    transition:background .15s ease;
  }
.rescue .back-btn:hover{background:var(--sky-tint); color:var(--sky-dark);}
.rescue .back-btn .icon{width:15px; height:15px;}
.rescue .q-count{color:var(--muted); font-size:13px; font-weight:700;}
.rescue .mission-tag{
    display:inline-flex; align-items:center; gap:8px; font-size:13.5px; color:var(--sky-dark);
    font-weight:700; margin-bottom:14px; background:var(--sky-tint); padding:6px 14px; border-radius:20px;
  }
.rescue .mission-tag .icon{width:16px; height:16px;}
.rescue .prompt{font-size:19px; line-height:1.9; margin-bottom:20px; font-weight:600; color:var(--text);}
.rescue .options{display:flex; flex-direction:column; gap:12px;}
.rescue .opt-btn{
    background:var(--surface-soft); border:2px solid var(--border); color:var(--text);
    padding:16px 18px; border-radius:var(--radius-md); font-size:16px; text-align:right;
    cursor:pointer; font-family:'Tajawal'; font-weight:500; transition:all .15s ease;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
.rescue .opt-btn:hover{border-color:var(--sky); background:var(--sky-tint);}
.rescue .opt-btn:focus-visible{outline:3px solid var(--sky); outline-offset:1px;}
.rescue .opt-btn .icon{width:20px; height:20px; opacity:0; transition:opacity .15s ease;}
.rescue .opt-btn.correct{border-color:var(--green); background:var(--green-tint); color:#0F6B4C;}
.rescue .opt-btn.correct .icon{opacity:1; color:var(--green);}
.rescue .opt-btn.wrong{border-color:var(--coral); background:var(--coral-tint); color:#9C3931;}
.rescue .opt-btn.wrong .icon{opacity:1; color:var(--coral);}
.rescue .order-built{
    min-height:50px; background:var(--sky-tint); border-radius:var(--radius-md); padding:14px 16px;
    font-size:18px; font-weight:600; margin-bottom:14px; border:2px dashed #A9D6EA; color:var(--sky-dark);
  }
.rescue .order-words{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px;}
.rescue .chip{
    background:var(--surface-soft); border:2px solid var(--border); color:var(--text);
    padding:12px 18px; border-radius:30px; font-size:15.5px; cursor:pointer; font-family:'Tajawal'; font-weight:500;
    transition:all .15s ease;
  }
.rescue .chip:hover{border-color:var(--purple); background:var(--purple-tint);}
.rescue .chip:disabled{opacity:0.35; cursor:default;}
.rescue .action-row{display:flex; gap:10px; margin-top:8px;}
.rescue .action-row button{
    flex:1; padding:14px; border-radius:var(--radius-md); border:none; cursor:pointer;
    font-family:'Tajawal'; font-weight:700; font-size:15px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
.rescue .action-row button:active{transform:scale(.97);}
.rescue .action-row .icon{width:18px; height:18px;}
.rescue .btn-primary{background:var(--sky); color:#fff; box-shadow:0 4px 14px rgba(46,156,202,0.35);}
.rescue .btn-primary:hover{background:var(--sky-dark);}
.rescue .btn-ghost{background:var(--amber-tint); color:#8A5F0C;}
.rescue .btn-ghost:hover{background:#F5E5C0;}
.rescue .feedback{
    margin-top:16px; font-size:15px; min-height:24px; font-weight:700;
    display:flex; align-items:center; gap:8px;
  }
.rescue .feedback .icon{width:18px; height:18px;}
.rescue .feedback.ok{color:#0F6B4C;}
.rescue .feedback.bad{color:#9C3931;}
.rescue .feedback.hint{
    color:#8A5F0C; background:var(--amber-tint); padding:12px 14px; border-radius:var(--radius-sm);
    font-weight:500; align-items:flex-start;
  }
.rescue .next-btn{
    display:none; width:100%; margin-top:16px; padding:16px; border-radius:var(--radius-md);
    background:var(--green); border:none; color:#fff; font-weight:700; font-size:15.5px;
    cursor:pointer; font-family:'Tajawal'; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 4px 14px rgba(40,168,122,0.35); transition:transform .12s ease;
  }
.rescue .next-btn:hover{background:#1F8E67;}
.rescue .next-btn:active{transform:scale(.98);}
.rescue .next-btn .icon{width:18px; height:18px;}
.rescue .celebrate{
    display:none; position:sticky; top:10px; z-index:5; text-align:center;
    background:linear-gradient(90deg,var(--amber),#F0C46A); color:#4A3407; padding:14px; border-radius:var(--radius-md);
    font-weight:800; margin:0 0 16px; font-family:'Cairo'; box-shadow:0 6px 18px rgba(232,169,58,0.35);
    align-items:center; justify-content:center; gap:8px;
  }
.rescue .celebrate .icon{width:20px; height:20px;}
.rescue .confetti{position:fixed; top:-20px; width:10px; height:10px; border-radius:2px; pointer-events:none; z-index:50;}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg); opacity:0;}}
.rescue footer{text-align:center; color:var(--muted); font-size:12.5px; margin-top:44px;}
@media (max-width:480px){.rescue .quiz-panel{padding:20px;}.rescue .mission-card{padding:16px;}}.rescue .teacher-box{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:18px 20px; margin-top:22px; box-shadow:var(--shadow);
    display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;
  }
.rescue .teacher-lines{display:flex; flex-direction:column; gap:4px; font-size:14.5px; color:var(--muted);}
.rescue .teacher-lines strong{font-family:'Cairo',sans-serif; font-size:17px; color:var(--text);}
.rescue .teacher-form{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; width:100%;}
.rescue .teacher-form label{display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:700; color:var(--muted);}
.rescue .teacher-form input, .rescue .teacher-form select{
    padding:11px 13px; border-radius:var(--radius-sm); border:2px solid var(--border);
    background:var(--surface-soft); font-family:'Tajawal',sans-serif; font-size:15px; color:var(--text);
  }
.rescue .teacher-form input:focus{outline:none; border-color:var(--sky); background:var(--sky-tint);}
.rescue .teacher-actions{display:flex; gap:10px;}
.rescue .teacher-edit, .rescue .teacher-save{
    border:1px solid var(--border); background:var(--surface-soft); color:var(--text);
    padding:9px 16px; border-radius:30px; cursor:pointer; font-family:'Tajawal',sans-serif;
    font-weight:700; font-size:13.5px; transition:all .15s ease;
  }
.rescue .teacher-edit:hover{background:var(--sky-tint); color:var(--sky-dark);}
.rescue .teacher-save{background:var(--sky); color:#fff; border-color:var(--sky);}
.rescue .teacher-save:hover{background:var(--sky-dark);}
.rescue .cert-row{display:flex; justify-content:center; margin-top:14px;}
.rescue .cert-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--amber-tint); color:#8A5F0C; border:1px solid #F3D48A;
  padding:8px 16px; border-radius:30px; cursor:pointer;
  font-family:'Tajawal',sans-serif; font-weight:700; font-size:13.5px;
  transition:all .15s ease;
}
.rescue .cert-btn:hover{background:#F5E5C0;}
.rescue .cert-overlay{
  position:fixed; inset:0; background:rgba(30,42,56,0.55);
  display:flex; align-items:center; justify-content:center;
  z-index:100; padding:20px; backdrop-filter:blur(4px);
}
.rescue .cert-dialog{
  width:min(720px,100%); max-height:90vh; overflow:auto;
  display:flex; flex-direction:column; gap:16px;
}
.rescue .cert-paper{
  background:#fff; border:8px double var(--sky);
  border-radius:4px; padding:38px 32px; text-align:center;
  box-shadow:0 20px 60px rgba(30,42,56,0.25);
  position:relative;
}
.rescue .cert-paper::before{
  content:""; position:absolute; inset:10px; border:2px solid var(--amber);
  pointer-events:none;
}
.rescue .cert-header{margin-bottom:22px;}
.rescue .cert-seal{
  width:56px; height:56px; display:block; margin:0 auto 8px;
  color:var(--amber);
}
.rescue .cert-seal svg{width:100%; height:100%;}
.rescue .cert-header h2{
  font-family:'Cairo',sans-serif; font-size:32px; font-weight:800;
  color:var(--sky-dark); margin:0;
}
.rescue .cert-header p{color:var(--muted); margin:6px 0 0; font-size:14px;}
.rescue .cert-intro{color:var(--muted); font-size:15px; margin-bottom:8px;}
.rescue .cert-name{
  width:100%; border:none; border-bottom:2px dashed var(--border);
  background:transparent; text-align:center; font-family:'Cairo',sans-serif;
  font-size:26px; font-weight:700; color:var(--text); padding:8px;
  margin-bottom:10px;
}
.rescue .cert-name:focus{outline:none; border-bottom-color:var(--sky);}
.rescue .cert-rank{
  font-family:'Cairo',sans-serif; font-size:22px; font-weight:800;
  color:var(--amber); margin:8px 0;
}
.rescue .cert-level{
  display:inline-block; background:var(--sky-tint); color:var(--sky-dark);
  padding:6px 18px; border-radius:30px; font-weight:700; font-size:14px;
}
.rescue .cert-stars{
  display:flex; align-items:center; justify-content:center; gap:8px;
  margin:18px 0; font-size:18px; color:var(--text);
}
.rescue .cert-stars svg{width:26px; height:26px; color:var(--amber);}
.rescue .cert-stars strong{font-size:28px; color:var(--amber);}
.rescue .cert-desc{
  color:var(--muted); font-size:14.5px; line-height:1.8;
  max-width:480px; margin:0 auto 24px;
}
.rescue .cert-footer{
  display:flex; justify-content:space-between; align-items:flex-end;
  border-top:1px solid var(--border); padding-top:18px; flex-wrap:wrap; gap:12px;
}
.rescue .cert-info{display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); text-align:right;}
.rescue .cert-date{font-family:'Cairo',sans-serif; font-weight:700; color:var(--text); font-size:15px;}
.rescue .cert-actions{display:flex; justify-content:center; gap:12px;}
.rescue .cert-actions button{
  padding:12px 22px; border-radius:30px; border:none; cursor:pointer;
  font-family:'Tajawal',sans-serif; font-weight:700; font-size:15px;
  transition:transform .12s ease;
}
.rescue .cert-actions button:active{transform:scale(.97);}
.rescue .cert-print{background:var(--sky); color:#fff;}
.rescue .cert-print:hover{background:var(--sky-dark);}
.rescue .cert-close{background:var(--surface-soft); color:var(--text); border:1px solid var(--border);}
.rescue .cert-close:hover{background:var(--sky-tint); color:var(--sky-dark);}

@media print{
  body > *:not(.rescue){display:none !important;}
  .rescue > *:not(.cert-overlay){display:none !important;}
  .rescue .cert-overlay{
    position:static; inset:auto; background:#fff; padding:0;
    display:block; width:100%; height:auto; backdrop-filter:none;
  }
  .rescue .cert-dialog{
    width:100%; max-height:none; overflow:visible; box-shadow:none;
  }
  .rescue .cert-paper{
    box-shadow:none; border:6px double var(--sky); padding:28px 24px;
    page-break-inside:avoid; max-width:100%;
  }
  .rescue .cert-actions{display:none !important;}
  .rescue .cert-name{border-bottom:1px dashed #ccc;}
}

/* ===== مؤقت صلاحية الرابط ===== */
.rescue .expiry-bar{
  display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
  margin:0 0 14px; padding:10px 14px; border-radius:14px;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
  font-size:.9rem;
}
.rescue .expiry-bar.soon{background:rgba(255,120,80,.16); border-color:rgba(255,120,80,.45);}
.rescue .expiry-bar strong{font-weight:800;}
.rescue .expired-wrap{display:flex; align-items:center; justify-content:center; min-height:70vh; padding:20px;}
.rescue .expired-card{
  text-align:center; max-width:460px; padding:34px 26px; border-radius:22px;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
}
.rescue .expired-card svg{
  width:64px; height:64px; margin-bottom:12px;
  fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; opacity:.85;
}
.rescue .expired-card h1{font-size:1.5rem; margin:0 0 10px;}
.rescue .expired-card p{margin:0; line-height:2; opacity:.85;}
@media print{ .rescue .expiry-bar{display:none !important;} }
